services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aioffice
      POSTGRES_PASSWORD: aioffice
      POSTGRES_DB: aioffice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioffice"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
